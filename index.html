<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#F3EEE4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11151B" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ULY MURA SCAN">
<meta name="description" content="Наведите камеру на памятник или табличку улицы Ақтөбе и узнайте его историю.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<title>ULY MURA SCAN · Ақтөбе</title>
<style>
/* ===================== ТОКЕНЫ ===================== */
:root{
  --paper:#F3EEE4; --paper-2:#EAE2D3; --card:#FBF8F2; --line:#DDD3C1; --line-2:#CFC2AB;
  --ink:#17202B; --ink-2:#3E4855; --muted:#675F53;
  --lapis:#0A6B76; --lapis-ink:#075A63; --lapis-soft:#D7EAEA;
  --ochre:#B7782C; --ochre-ink:#8A5517; --ochre-soft:#F1E1C7;
  --ok:#2C7A4B; --ok-soft:#DCEFE2; --err:#B3261E; --err-soft:#F6DEDB;
  --night:#0E141A; --night-2:#18212A; --on-night:#F2ECE1; --on-night-2:#B9B2A6;
  --shadow:0 1px 0 rgba(23,32,43,.04),0 8px 24px -12px rgba(23,32,43,.18);
  --r-s:10px; --r-m:16px; --r-l:24px;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
  --head:60px; --nav:66px;
  --f-display:"Unbounded",system-ui,sans-serif; --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#11151B; --paper-2:#171D25; --card:#1B222B; --line:#2A333E; --line-2:#36414E;
  --ink:#EEE7DA; --ink-2:#C9C1B3; --muted:#A39A8C;
  --lapis:#4DB3BE; --lapis-ink:#7CCAD2; --lapis-soft:#173A40;
  --ochre:#D7A15A; --ochre-ink:#E2B677; --ochre-soft:#3A2D1C;
  --ok:#62C08A; --ok-soft:#183626; --err:#F08A80; --err-soft:#3E1E1C;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 10px 28px -14px rgba(0,0,0,.6);
  color-scheme:dark;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--head) + var(--st) + 12px);scroll-padding-bottom:calc(var(--nav) + var(--sb) + 12px)}
html,body{margin:0;min-height:100%;background:var(--paper)}
body{color:var(--ink);font:400 16px/1.5 var(--f-body);overflow-x:hidden;overscroll-behavior-y:none;touch-action:manipulation}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
svg{display:block;flex:none}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--lapis);outline-offset:2px;border-radius:8px}
.hidden{display:none!important}

/* ===================== ШАПКА ===================== */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:saturate(1.2) blur(10px);-webkit-backdrop-filter:saturate(1.2) blur(10px);
  padding:calc(8px + var(--st)) calc(16px + var(--sr)) 8px calc(16px + var(--sl));border-bottom:1px solid transparent}
.top.scrolled{border-bottom-color:var(--line)}
.top-in{max-width:1180px;margin:0 auto;height:44px;display:flex;align-items:center;gap:12px}
.mark{width:40px;height:40px;border-radius:11px;flex:none;display:block}
.brand b i{font-style:normal;font-family:var(--f-body);font-weight:700;font-size:.72em;letter-spacing:.28em;color:var(--lapis-ink);margin-left:.15em}
.brand{min-width:0;flex:1}
.brand b{display:block;font:600 16px/1.15 var(--f-display);letter-spacing:-.01em}
.brand span{font-size:12.5px;color:var(--muted)}
.ring{position:relative;width:40px;height:40px;flex:none;display:grid;place-items:center}
.ring svg{position:absolute;inset:0}
.ring svg circle{transition:stroke-dashoffset .5s ease}
.ring span{position:relative;font-size:10.5px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.lang{display:flex;padding:3px;border-radius:12px;background:var(--paper-2);flex:none}
.lang button{min-width:40px;height:34px;padding:0 6px;border-radius:9px;font-size:12px;font-weight:700;letter-spacing:.02em;color:var(--muted)}
.lang button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.brand b,.brand span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:440px){.brand span{display:none}.brand b{font-size:15px}.top-in{gap:10px}}
@media (max-width:400px){.mark{display:none}}
@media (max-width:374px){.brand b{font-size:13.5px}.brand b i{letter-spacing:.16em}.lang button{min-width:35px;padding:0 3px;font-size:11.5px}.top-in{gap:8px}}

/* ===================== КАРКАС ===================== */
.app{max-width:1180px;margin:0 auto;padding:4px calc(16px + var(--sr)) calc(var(--nav) + var(--sb) + 20px) calc(16px + var(--sl))}
.panel{min-width:0}
.eyebrow{font:600 11.5px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px;margin:18px 2px 10px}
.eyebrow::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}

/* ===================== СКАНЕР ===================== */
.vp{position:relative;border-radius:var(--r-l);overflow:hidden;background:var(--night);color:var(--on-night);isolation:isolate;
  height:clamp(300px,calc(100dvh - var(--st) - var(--sb) - var(--head) - var(--nav) - 190px),600px)}
.vp video,.vp .shot{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.vp::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(120% 70% at 50% 0%,rgba(10,107,118,.28),transparent 60%),radial-gradient(90% 60% at 50% 110%,rgba(183,120,44,.18),transparent 60%)}
.vp[data-state=camera]::before,.vp[data-state=found]::before,.vp[data-state=analyzing]::before,.vp[data-state=nomatch]::before{background:linear-gradient(180deg,rgba(14,20,26,.55),transparent 22%,transparent 70%,rgba(14,20,26,.7))}
/* узор-сетка на холостом экране */
.vp .pattern{position:absolute;inset:0;z-index:1;opacity:.045;color:var(--on-night)}
.vp[data-state=camera] .pattern,.vp[data-state=analyzing] .pattern,.vp[data-state=found] .pattern,.vp[data-state=nomatch] .pattern{display:none}
/* рамка наведения: уголки «қошқар мүйіз» */
.aim{position:absolute;z-index:2;left:50%;top:47%;width:min(68%,340px);aspect-ratio:1;transform:translate(-50%,-50%);pointer-events:none;color:rgba(242,236,225,.92);transition:color .25s ease,transform .3s ease}
.aim svg{position:absolute;width:30%;height:30%}
.aim .c1{left:0;top:0}.aim .c2{right:0;top:0;transform:scaleX(-1)}.aim .c3{left:0;bottom:0;transform:scaleY(-1)}.aim .c4{right:0;bottom:0;transform:scale(-1)}
.vp[data-state=loading] .aim,.vp[data-state=error] .aim,.vp[data-state=nomatch] .aim{opacity:.12}
.vp[data-state=idle] .aim{top:42%;width:min(58%,300px)}
.vp[data-state=idle] .center{place-items:end center;padding:0 24px 22px}
.vp[data-state=idle] .center .glyph{display:none}
.vp[data-state=idle] .center h2{margin-top:0}
.vp[data-state=found] .aim{color:#7BE0A6;transform:translate(-50%,-50%) scale(.96)}
.vp[data-state=nomatch] .aim{color:#F2B8A0}
/* линия сканирования — только когда реально идёт анализ */
.sweep{position:absolute;left:6%;right:6%;height:2px;top:8%;border-radius:2px;background:linear-gradient(90deg,transparent,#7FD4DC,transparent);opacity:0}
.vp[data-state=camera] .sweep,.vp[data-state=analyzing] .sweep{opacity:.9;animation:sweep 2.4s ease-in-out infinite}
@keyframes sweep{0%{top:8%}50%{top:90%}100%{top:8%}}
/* верхняя плашка состояния */
.state{position:absolute;z-index:3;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:999px;background:rgba(14,20,26,.66);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:13px;font-weight:600;color:var(--on-night);border:1px solid rgba(242,236,225,.14)}
.dot{width:8px;height:8px;border-radius:50%;background:#9AA3AD}
.vp[data-state=idle] .dot{background:#7FD4DC}
.vp[data-state=camera] .dot,.vp[data-state=analyzing] .dot{background:#7FD4DC;animation:blink 1.2s ease-in-out infinite}
.vp[data-state=found] .dot{background:#7BE0A6}
.vp[data-state=error] .dot,.vp[data-state=nomatch] .dot{background:#F2A08F}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid rgba(242,236,225,.3);border-top-color:#F2ECE1;animation:rot .8s linear infinite}
@keyframes blink{50%{opacity:.35}} @keyframes rot{to{transform:rotate(360deg)}}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(14,20,26,.66);color:var(--on-night);border:1px solid rgba(242,236,225,.14)}
/* центр холостого экрана */
.center{position:absolute;z-index:3;inset:0;display:grid;place-items:center;text-align:center;padding:64px 28px 88px}
.center h2{font:600 clamp(18px,4.8vw,22px)/1.25 var(--f-display);margin:12px 0 6px;letter-spacing:-.01em}
.center p{margin:0 auto;max-width:30ch;color:var(--on-night-2);font-size:14.5px}
.center .glyph{width:56px;height:56px;margin:0 auto;border-radius:16px;display:grid;place-items:center;background:rgba(242,236,225,.08);border:1px solid rgba(242,236,225,.16)}
.center .acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.center .btn{height:44px;padding:0 16px;font-size:14.5px}
.vp[data-state=nomatch] .center>div,.vp[data-state=error] .center>div{max-width:360px;padding:20px 18px;border-radius:20px;background:rgba(14,20,26,.8);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(242,236,225,.12)}
.vp[data-state=nomatch] .glyph,.vp[data-state=error] .glyph{color:#F2B8A0}
/* нижняя полоса уверенности */
.meter{position:absolute;z-index:3;left:12px;right:12px;bottom:12px;padding:10px 12px;border-radius:14px;background:rgba(14,20,26,.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(242,236,225,.14)}
.meter .row{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;font-weight:600}
.meter .row span:last-child{font-variant-numeric:tabular-nums;color:var(--on-night-2)}
.bar{height:6px;margin-top:8px;border-radius:3px;background:rgba(242,236,225,.16);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,#7FD4DC,#7BE0A6);transition:width .25s ease}
.bar .th{position:relative}
.meter small{display:block;margin-top:6px;color:var(--on-night-2);font-size:12px}

/* кнопки */
.ctrl{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 20px;border-radius:16px;font-weight:600;font-size:16px;transition:transform .12s ease,background .2s ease}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--ink);color:var(--paper)}
.btn-primary[aria-pressed=true]{background:var(--err);color:#fff}
.btn-ghost{background:var(--card);border:1px solid var(--line);color:var(--ink)}
.btn-light{background:var(--on-night);color:var(--night)}
.btn-line{background:transparent;border:1px solid rgba(242,236,225,.3);color:var(--on-night)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-sq{width:54px;padding:0}
.tip{display:flex;gap:10px;align-items:flex-start;margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--paper-2);color:var(--ink-2);font-size:13.5px;line-height:1.45}
.tip svg{color:var(--lapis);margin-top:1px}

/* последние изученные */
.recent{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 4px}
.recent::-webkit-scrollbar{display:none}
.rchip{flex:none;display:flex;align-items:center;gap:10px;max-width:260px;padding:8px 14px 8px 8px;border-radius:14px;background:var(--card);border:1px solid var(--line);text-align:left}
.rchip .ti{width:36px;height:36px}
.rchip b{display:block;font-size:14px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
.rchip small{color:var(--muted);font-size:12px}
.empty-mini{padding:14px;border-radius:14px;border:1px dashed var(--line-2);color:var(--muted);font-size:13.5px}

/* ===================== КАТАЛОГ ===================== */
.cat-head h2{font:600 22px/1.2 var(--f-display);margin:14px 2px 4px;letter-spacing:-.01em}
.cat-head p{margin:0 2px 12px;color:var(--muted);font-size:14px}
.search{position:relative}
.search input{width:100%;height:50px;border-radius:14px;border:1px solid var(--line);background:var(--card);padding:0 46px 0 44px;font-size:16px;outline:none}
.search input:focus{border-color:var(--lapis);box-shadow:0 0 0 3px color-mix(in srgb,var(--lapis) 22%,transparent)}
.search input::placeholder{color:var(--muted)}
.search input::-webkit-search-cancel-button,.search input::-webkit-search-decoration{-webkit-appearance:none;appearance:none;display:none}
.search .s-ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search .clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:12px -16px 4px;padding:2px 16px 6px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip .n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip[aria-pressed=true] .n{color:inherit;opacity:.7}
.group{margin-top:16px}
.ghead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 2px 8px}
.ghead h3{margin:0;font:600 15px/1.3 var(--f-display);display:flex;align-items:center;gap:8px}
.ghead h3 svg{color:var(--ochre)}
.ghead span{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.list{display:grid;gap:8px}
.item{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;width:100%;min-height:72px;padding:12px 12px 12px 12px;border-radius:var(--r-m);background:var(--card);border:1px solid var(--line);text-align:left;box-shadow:var(--shadow);transition:border-color .2s ease,transform .12s ease}
.item:hover{border-color:var(--line-2)}
.item:active{transform:scale(.99)}
.ti{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--lapis-soft);color:var(--lapis-ink)}
.ti.street{background:var(--ochre-soft);color:var(--ochre-ink)}
.item b{display:block;font-size:15.5px;line-height:1.25;font-weight:600}
.item .kk{display:block;font-size:13px;color:var(--lapis-ink);margin-top:2px}
.item .meta{display:block;font-size:12.5px;color:var(--muted);margin-top:3px}
.badge{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1.5px dashed var(--line-2);color:transparent}
.badge.on{border:0;background:var(--ok-soft);color:var(--ok)}
.nores{text-align:center;padding:36px 20px;border-radius:var(--r-m);border:1px dashed var(--line-2);margin-top:12px}
.nores b{display:block;font:600 16px/1.3 var(--f-display);margin:10px 0 4px}
.nores p{margin:0 0 14px;color:var(--muted);font-size:14px}
.nores svg{margin:0 auto;color:var(--muted)}

/* ===================== НИЖНЯЯ НАВИГАЦИЯ ===================== */
.nav{position:fixed;z-index:30;left:0;right:0;bottom:0;padding:8px calc(16px + var(--sr)) calc(8px + var(--sb)) calc(16px + var(--sl));background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.nav-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:4px;border-radius:18px;background:var(--paper-2)}
.nav button{height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:600;color:var(--muted)}
.nav button[aria-selected=true]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}

/* ===================== КАРТОЧКА ===================== */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(10,14,18,.5);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .22s ease}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:relative;width:100%;max-width:640px;max-height:min(90dvh,860px);overflow:auto;overscroll-behavior:contain;background:var(--card);border-radius:28px 28px 0 0;
  padding:0 calc(20px + var(--sr)) calc(20px + var(--sb)) calc(20px + var(--sl));transform:translateY(24px);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.scrim.show .sheet{transform:none}
.sheet-top{position:sticky;top:0;z-index:2;background:var(--card);padding:10px 0 8px;display:flex;align-items:center;justify-content:space-between}
.grab{position:absolute;left:50%;top:6px;width:40px;height:5px;border-radius:3px;background:var(--line-2);transform:translateX(-50%)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.tag{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:8px;font-size:12.5px;font-weight:600;background:var(--paper-2);color:var(--ink-2)}
.tag.l{background:var(--lapis-soft);color:var(--lapis-ink)}
.close{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--paper-2);color:var(--ink)}
.sheet h2{font:600 clamp(22px,6vw,28px)/1.18 var(--f-display);margin:2px 0 6px;letter-spacing:-.015em}
.sheet .kkname{font-size:16px;font-weight:600;color:var(--lapis-ink);margin:0}
.conf{display:inline-flex;align-items:center;gap:8px;margin-top:12px;padding:8px 12px;border-radius:12px;background:var(--ok-soft);color:var(--ok);font-size:13.5px;font-weight:600}
.orn{display:block;width:100%;height:14px;margin:18px 0 12px;color:var(--ochre);opacity:.7}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0}
.fact{padding:12px;border-radius:14px;background:var(--paper);border:1px solid var(--line);min-width:0}
.fact.wide{grid-column:1/-1}
.fact dt{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.fact dd{margin:4px 0 0;font-size:15px;font-weight:500;line-height:1.4;overflow-wrap:anywhere}
.story h3{font:600 13px/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
.story p{margin:0;font-size:17px;line-height:1.65;color:var(--ink)}
.note{margin-top:16px;padding:12px 14px;border-radius:12px;background:var(--paper-2);color:var(--muted);font-size:12.5px;line-height:1.45;display:flex;gap:8px}
.sheet .btn{width:100%;margin-top:16px}

/* ===================== ТОСТ ===================== */
.toast{position:fixed;z-index:50;left:50%;bottom:calc(var(--nav) + var(--sb) + 16px);transform:translate(-50%,20px);opacity:0;padding:10px 16px;border-radius:12px;background:var(--ink);color:var(--paper);font-size:14px;font-weight:500;transition:all .25s ease;pointer-events:none;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ===================== АДАПТИВ ===================== */
@media (max-height:640px){ .vp{height:clamp(240px,calc(100dvh - var(--st) - var(--sb) - var(--head) - var(--nav) - 150px),600px)} .tip{display:none} }
@media (min-width:1024px){
  .app{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:36px;padding-bottom:40px;align-items:start}
  .panel.scan{position:sticky;top:calc(var(--head) + 16px)}
  .vp{height:min(68vh,640px)}
  #catalog{display:block!important}
  #scan{display:block!important}
  .nav{display:none}
  .toast{bottom:24px}

  .sheet{border-radius:28px;max-height:86vh}

  .recent{margin:0;padding:2px 0 4px;flex-wrap:wrap}

}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  .vp[data-state=camera] .sweep,.vp[data-state=analyzing] .sweep{animation:none;top:50%;opacity:.6}
}

<script>
"use strict";
const $ = id => document.getElementById(id);
const BY_ID = Object.fromEntries(ALL_OBJECTS.map(o => [o.id, o]));
const THRESH = 0.8, STABLE = 4, PHOTO_THRESH = 0.55;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ico = (id, s = 20) => `<svg width="${s}" height="${s}" aria-hidden="true"><use href="#${id}"/></svg>`;
const typeIco = (o, s = 22) => `<span class="ti ${o.type === "street" ? "street" : ""}" aria-hidden="true">${ico("t-" + o.type, s)}</span>`;
const isDesktop = () => matchMedia("(min-width:1024px)").matches;

/* ---------- язык ---------- */
let lang = "ru";
try { lang = localStorage.getItem("lang") || ""; } catch (e) {}
if (!UI[lang]) { const n = (navigator.language || "").toLowerCase(); lang = n.startsWith("kk") ? "kk" : n.startsWith("ru") ? "ru" : n.startsWith("en") ? "en" : "kk"; }
const t = (k, ...a) => { const v = (UI[lang] && UI[lang][k]) ?? UI.ru[k]; return typeof v === "function" ? v(...a) : v; };
const zoneName = z => t("zones")[z] || z;
const typeName = ty => t("types")[ty] || ty;
// Объект на текущем языке; second — название на втором языке под заголовком
function L(o) {
  const tr = (OBJ_I18N[o.id] || {})[lang] || {};
  const base = lang === "ru" ? o : { ...o, ...tr };
  return {
    name: base.name || o.name, place: base.place || o.place, year: tr.year || o.year,
    oldNames: lang === "ru" ? o.oldNames : (tr.oldNames || o.oldNames), text: base.text || o.text,
    second: lang === "kk" ? o.name : o.nameKk, secondLang: lang === "kk" ? "ru" : "kk",
  };
}
function setLang(l) {
  lang = l;
  try { localStorage.setItem("lang", l); } catch (e) {}
  applyStatic(); renderLang(); renderProgress(); renderRecent(); renderChips(); renderList();
  setState($("vp").dataset.state, lastStateOpts);
  if (cardOpen && cardId) openCard(cardId, cardProb, true);
}
function applyStatic() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll("[data-i18n-aria]").forEach(el => el.setAttribute("aria-label", t(el.dataset.i18nAria)));
  document.querySelectorAll("[data-i18n-title]").forEach(el => el.setAttribute("title", t(el.dataset.i18nTitle)));
  document.querySelectorAll("[data-i18n-ph]").forEach(el => el.setAttribute("placeholder", t(el.dataset.i18nPh)));
  $("lang").setAttribute("aria-label", t("langLbl"));
  if (!$("meter").classList.contains("hidden") && !$("mName").dataset.hit) $("mName").textContent = t("meterSearch");
  updateCamBtn();
}
function renderLang() {
  $("lang").innerHTML = Object.entries(LANGS).map(([k, v]) => `<button lang="${k}" data-l="${k}" aria-pressed="${k === lang}">${v}</button>`).join("");
  $("lang").querySelectorAll("button").forEach(b => b.onclick = () => setLang(b.dataset.l));
}

let model = null, stream = null, running = false, busy = false, lastId = null, streak = 0;
let photoURL = null, cardOpen = false, cardId = null, cardProb = null, lastFocus = null, loopTimer = null, lastStateOpts = {};

/* ---------- прогресс (localStorage, порядок = история изучения) ---------- */
let seen = [];
try { seen = JSON.parse(localStorage.getItem("seen") || "[]").filter(id => BY_ID[id]); } catch (e) {}
const isSeen = id => seen.includes(id);
function markSeen(id) {
  seen = seen.filter(x => x !== id); seen.push(id);
  try { localStorage.setItem("seen", JSON.stringify(seen)); } catch (e) {}
  renderProgress(); renderRecent(); renderList();
}
function renderProgress() {
  const done = OBJECTS.filter(o => isSeen(o.id)).length, total = OBJECTS.length;
  $("ringTxt").textContent = `${done}/${total}`;
  $("ringArc").setAttribute("stroke-dashoffset", (106.8 * (1 - done / Math.max(total, 1))).toFixed(2));
  $("ring").setAttribute("aria-label", t("progress", done, total));
  $("ring").title = t("progress", done, total);
}
function renderRecent() {
  const ids = seen.slice(-6).reverse();
  $("recent").innerHTML = ids.length
    ? `<div class="recent">${ids.map(id => { const o = BY_ID[id], l = L(o); return `<button class="rchip" data-id="${o.id}">${typeIco(o, 18)}<span><b>${esc(l.name)}</b><small>${esc(zoneName(o.zone))}</small></span></button>`; }).join("")}</div>`
    : `<div class="empty-mini">${esc(t("recentEmpty"))}</div>`;
  $("recent").querySelectorAll(".rchip").forEach(b => b.onclick = () => openCard(b.dataset.id));
}

/* ---------- состояния экрана сканера ---------- */
const STATES = {
  loading: { pill: "stLoading", spin: true }, idle: { pill: "stIdle" }, camera: { pill: "stCamera" },
  analyzing: { pill: "stAnalyzing", spin: true }, found: { pill: "stFound" }, nomatch: { pill: "stNomatch" }, error: { pill: "stError" },
};
// opts: { title, text, actions: [[act, icon, labelKey, style]] } — ключи переводов, чтобы экран пересобирался при смене языка
function setState(s, opts = {}) {
  lastStateOpts = opts;
  const vp = $("vp"); vp.dataset.state = s;
  $("pillTxt").textContent = t(STATES[s].pill);
  $("pillDot").className = STATES[s].spin ? "spin" : "dot";
  const live = s === "camera" || s === "analyzing" || s === "found" || s === "nomatch";
  $("meter").classList.toggle("hidden", !(s === "camera" || s === "analyzing"));
  $("vpClose").classList.toggle("hidden", !(s === "nomatch" || (s === "found" && !running && photoURL)));
  const c = $("center");
  if (s === "loading") c.innerHTML = centerHTML("i-hist", t("loadT"), t("loadX"));
  else if (s === "idle") c.innerHTML = centerHTML("i-scan", t("idleT"), t("idleX"));
  else if (s === "nomatch") c.innerHTML = centerHTML("i-alert", t("nomT"), t(opts.text || "nomLow"), [["photo", "i-img", "otherPhoto", "light"], ["reset", null, "reset", "line"]]);
  else if (s === "error") c.innerHTML = centerHTML("i-alert", opts.titleRaw || t(opts.title || "stError"), opts.textRaw || t(opts.text || ""), opts.actions || []);
  else c.innerHTML = "";
  c.classList.toggle("hidden", live && s !== "nomatch");
  c.querySelectorAll("[data-act]").forEach(b => b.onclick = () => ACTIONS[b.dataset.act]());
  updateCamBtn();
}
function centerHTML(icon, title, text, acts = []) {
  const btns = acts.map(([a, i, k, st]) => `<button class="btn btn-${st}" data-act="${a}">${i ? ico(i) : ""}${esc(t(k))}</button>`).join("");
  return `<div><div class="glyph">${ico(icon, 26)}</div><h2>${esc(title)}</h2><p>${esc(text)}</p>${btns ? `<div class="acts">${btns}</div>` : ""}</div>`;
}
const ACTIONS = {
  photo: () => $("photoIn").click(), reset: () => resetView(), retry: () => loadModel(),
  reload: () => location.reload(),
};
function updateCamBtn() {
  const b = $("camBtn");
  b.disabled = !model;
  b.setAttribute("aria-pressed", running ? "true" : "false");
  $("camTxt").textContent = t(running ? "stop" : "scan");
  $("camIco").innerHTML = `<use href="#${running ? "i-stop" : "i-cam"}"/>`;
}

/* ---------- модель ---------- */
async function loadModel() {
  if (!window.tf || !window.ML) { setState("error", { title: "noNetT", text: "noNetX", actions: [["reload", "i-refresh", "reload", "light"]] }); return; }
  setState("loading");
  try {
    await ML.loadBase("model/mobilenet/model.json");
    const json = await (await fetch("model/classifier.json", { cache: "no-cache" })).json();
    model = ML.makeClassifier(json); setState("idle");
  } catch (e) { model = null; setState("error", { title: "modelErrT", text: "modelErrX", actions: [["retry", "i-refresh", "retry", "light"]] }); }
}
async function classify(el) { return (await model.predict(el))[0]; }
function showMeter(top) {
  const o = BY_ID[top.className], p = Math.round(top.probability * 100), hit = o && top.probability >= 0.4;
  $("mBar").style.width = (o ? p : 0) + "%";
  $("mPct").textContent = o ? p + "%" : "—";
  $("mName").textContent = hit ? L(o).name : t("meterSearch");
  $("mName").dataset.hit = hit ? "1" : "";
}

/* ---------- камера ---------- */
async function startCam() {
  if (!model || running) return;
  clearPhoto();
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { camError({ name: window.isSecureContext ? "NotFoundError" : "InsecureError" }); return; }
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
    const v = $("video"); v.srcObject = stream; v.classList.remove("hidden");
    await v.play();
    running = true; streak = 0; lastId = null;
    setState("camera"); showMeter({ className: "", probability: 0 });
    loop();
  } catch (e) { stopCam(); camError(e); }
}
function camError(e) {
  const map = { NotAllowedError: "camDenied", NotFoundError: "camNone", NotReadableError: "camBusy", InsecureError: "camHttps" };
  const k = map[e && e.name] || "camOther";
  setState("error", { title: k + "T", text: k + "X", actions: [["photo", "i-img", "choosePhoto", "light"], ["reset", null, "back", "line"]] });
}
function stopCam() {
  running = false; clearTimeout(loopTimer);
  if (stream) stream.getTracks().forEach(tr => tr.stop());
  stream = null;
  const v = $("video"); v.pause(); v.srcObject = null; v.classList.add("hidden");
  updateCamBtn();
}
async function loop() {
  if (!running) return;
  const v = $("video");
  if (model && !cardOpen && !busy && v.readyState >= 2) {
    busy = true;
    try {
      const top = await classify(v);
      if (!running) return;
      showMeter(top);
      if (BY_ID[top.className] && top.probability >= THRESH) {
        streak = top.className === lastId ? streak + 1 : 1; lastId = top.className;
        if (streak >= STABLE) { setState("found"); openCard(top.className, top.probability); }
      } else { streak = 0; lastId = null; }
    } catch (e) {} finally { busy = false; }
  }
  loopTimer = setTimeout(() => requestAnimationFrame(loop), 160);
}
$("camBtn").onclick = () => running ? (stopCam(), setState(model ? "idle" : "loading")) : startCam();

/* ---------- фото из галереи ---------- */
function clearPhoto() {
  if (photoURL) { URL.revokeObjectURL(photoURL); photoURL = null; }
  const s = $("shot"); s.removeAttribute("src"); s.classList.add("hidden");
}
function resetView() { if (running) stopCam(); clearPhoto(); setState(model ? "idle" : "loading"); if (!model) loadModel(); }
$("photoLbl").addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("photoIn").click(); } });
$("photoIn").onchange = e => {
  const file = e.target.files[0]; e.target.value = "";
  if (!file) return;
  if (!model) { toast(t("modelNotReady")); return; }
  if (running) stopCam();
  clearPhoto();
  photoURL = URL.createObjectURL(file);
  const img = $("shot");
  setState("analyzing"); showMeter({ className: "", probability: 0 });
  img.onerror = () => { clearPhoto(); setState("error", { title: "fileBadT", text: "fileBadX", actions: [["photo", "i-img", "chooseOther", "light"]] }); };
  img.onload = async () => {
    img.classList.remove("hidden");
    try {
      const top = await classify(img); showMeter(top);
      if (BY_ID[top.className] && top.probability >= PHOTO_THRESH) { setState("found"); openCard(top.className, top.probability); }
      else setState("nomatch", { text: top.className === "fon" ? "nomFon" : "nomLow" });
    } catch (err) { setState("error", { title: "recogErrT", textRaw: err.message, actions: [["reset", null, "back", "light"]] }); }
  };
  img.src = photoURL;
};
$("vpClose").onclick = resetView;

/* ---------- каталог ---------- */
const FILTERS = [
  { id: "all", key: "fAll", test: o => o.zone in ZONES },
  ...Object.keys(ZONES).map(k => ({ id: k, zone: k, test: o => o.zone === k })),
  { id: "seen", key: "fSeen", test: o => isSeen(o.id) },
  { id: "other", key: "fOther", test: o => !(o.zone in ZONES) },
];
const fLabel = f => f.key ? t(f.key) : zoneName(f.zone);
let filter = "all", query = "";
const norm = s => String(s || "").toLowerCase().replace(/ё/g, "е");
function renderChips() {
  $("chips").innerHTML = FILTERS.map(f => `<button class="chip" data-f="${f.id}" aria-pressed="${f.id === filter}">${esc(fLabel(f))}<span class="n">${ALL_OBJECTS.filter(f.test).length}</span></button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b => b.onclick = () => { filter = b.dataset.f; renderChips(); renderList(); });
}
function itemHTML(o) {
  const done = isSeen(o.id), l = L(o);
  return `<button class="item" data-id="${o.id}" aria-label="${esc(l.name)}${done ? ", " + esc(t("studiedA")) : ""}">
    ${typeIco(o)}
    <span><b>${esc(l.name)}</b><span class="kk" lang="${l.secondLang}">${esc(l.second)}</span><span class="meta">${esc(typeName(o.type))}${l.year && l.year !== "—" ? " · " + esc(l.year) : ""}</span></span>
    <span class="badge ${done ? "on" : ""}" aria-hidden="true">${ico("i-check", 16)}</span>
  </button>`;
}
// поиск ищет по всем трём языкам
function haystack(o) {
  const tr = OBJ_I18N[o.id] || {};
  return [o, tr.kk || {}, tr.en || {}].flatMap(x => [x.name, x.place, x.year, x.oldNames, x.text]).concat(o.nameKk).map(norm).join(" ");
}
function renderList() {
  const f = FILTERS.find(x => x.id === filter);
  const q = norm(query.trim());
  const items = ALL_OBJECTS.filter(f.test).filter(o => !q || haystack(o).includes(q));
  $("qClear").classList.toggle("hidden", !query);
  if (!items.length) {
    const byQuery = !!q;
    $("list").innerHTML = `<div class="nores">${ico(byQuery ? "i-search" : "i-book", 28)}<b>${esc(t(byQuery ? "nfT" : "emptyT"))}</b><p>${esc(byQuery ? t("nfX", query.trim(), fLabel(f)) : t("emptyX"))}</p>${byQuery ? `<button class="btn btn-ghost" id="resetQ">${esc(t("resetSearch"))}</button>` : ""}</div>`;
    const r = $("resetQ"); if (r) r.onclick = () => { query = ""; $("q").value = ""; filter = "all"; renderChips(); renderList(); $("q").focus(); };
    return;
  }
  const groups = {};
  items.forEach(o => (groups[o.zone] = groups[o.zone] || []).push(o));
  const order = [...Object.keys(ZONES), "center", "old"];
  $("list").innerHTML = order.filter(z => groups[z]).map(z => {
    const g = groups[z], d = g.filter(o => isSeen(o.id)).length;
    return `<div class="group"><div class="ghead"><h3>${ico("i-pin", 16)}${esc(zoneName(z))}</h3><span>${esc(t("studied", d, g.length))}</span></div><div class="list">${g.map(itemHTML).join("")}</div></div>`;
  }).join("");
  $("list").querySelectorAll(".item").forEach(el => el.onclick = () => openCard(el.dataset.id));
}
$("q").addEventListener("input", e => { query = e.target.value; renderList(); });
$("qClear").onclick = () => { query = ""; $("q").value = ""; renderList(); $("q").focus(); };

/* ---------- карточка ---------- */
function openCard(id, prob, rerender) {
  const o = BY_ID[id]; if (!o) return;
  const l = L(o);
  if (!cardOpen) lastFocus = document.activeElement;
  cardOpen = true; cardId = id; cardProb = prob || null;
  if (prob && !rerender && navigator.vibrate) navigator.vibrate(60);
  const fact = (icon, label, val, wide) => `<div class="fact ${wide ? "wide" : ""}"><dt>${ico(icon, 14)}${esc(label)}</dt><dd>${esc(val)}</dd></div>`;
  $("sheet").innerHTML = `
    <div class="sheet-top"><span class="grab" aria-hidden="true"></span>
      <div class="tags"><span class="tag l">${ico("t-" + o.type, 14)}${esc(typeName(o.type))}</span><span class="tag">${ico("i-pin", 14)}${esc(zoneName(o.zone))}</span></div>
      <button class="close" id="cClose" aria-label="${esc(t("closeCard"))}">${ico("i-x")}</button>
    </div>
    <h2 id="cTitle">${esc(l.name)}</h2>
    <p class="kkname" lang="${l.secondLang}">${esc(l.second)}</p>
    ${prob ? `<div class="conf">${ico("i-check", 16)}${esc(t("recognized", Math.round(prob * 100)))}</div>` : ""}
    <svg class="orn" aria-hidden="true" viewBox="0 0 240 14" preserveAspectRatio="xMidYMid meet"><use href="#o-line"/></svg>
    <dl class="facts">
      ${fact("i-cal", t("year"), l.year && l.year !== "—" ? l.year : t("noYear"))}
      ${fact("t-" + o.type, t("type"), typeName(o.type))}
      ${fact("i-pin", t("where"), l.place || "—", true)}
      ${l.oldNames ? fact("i-hist", t("names"), l.oldNames, true) : ""}
    </dl>
    <div class="story"><h3>${esc(t("history"))}</h3><p>${esc(l.text)}</p></div>
    <div class="note">${ico("i-info", 16)}<span>${esc(t("source"))}</span></div>
    <button class="btn btn-primary" id="cDone">${running ? `${ico("i-scan")}${esc(t("continueScan"))}` : esc(t("close"))}</button>`;
  $("sheet").setAttribute("lang", lang);
  const scrim = $("scrim");
  scrim.classList.add("show"); scrim.setAttribute("aria-hidden", "false");
  document.body.style.overflow = "hidden";
  $("cClose").onclick = closeCard; $("cDone").onclick = closeCard;
  if (!rerender) { $("sheet").scrollTop = 0; setTimeout(() => $("cClose").focus({ preventScroll: true }), 30); markSeen(id); }
}
function closeCard() {
  if (!cardOpen) return;
  cardOpen = false; cardId = null; streak = 0; lastId = null;
  const scrim = $("scrim");
  scrim.classList.remove("show"); scrim.setAttribute("aria-hidden", "true");
  document.body.style.overflow = "";
  if (running) setState("camera");
  if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
}
$("scrim").addEventListener("click", e => { if (e.target.id === "scrim") closeCard(); });
document.addEventListener("keydown", e => {
  if (!cardOpen) return;
  if (e.key === "Escape") { e.preventDefault(); closeCard(); }
  if (e.key === "Tab") {
    const f = [...$("sheet").querySelectorAll("button,[href],[tabindex]:not([tabindex='-1'])")];
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});
let ty = null;
$("sheet").addEventListener("touchstart", e => { ty = $("sheet").scrollTop <= 0 ? e.touches[0].clientY : null; }, { passive: true });
$("sheet").addEventListener("touchend", e => { if (ty !== null && e.changedTouches[0].clientY - ty > 90) closeCard(); ty = null; }, { passive: true });

/* ---------- вкладки ---------- */
function tab(name) {
  const scan = name === "scan";
  $("tab-scan").setAttribute("aria-selected", scan); $("tab-cat").setAttribute("aria-selected", !scan);
  $("scan").hidden = !scan; $("catalog").hidden = scan;
  if (!scan && running && !isDesktop()) { stopCam(); setState("idle"); }
  window.scrollTo(0, 0);
}
$("tab-scan").onclick = () => tab("scan");
$("tab-cat").onclick = () => tab("cat");
document.querySelector(".nav-in").addEventListener("keydown", e => {
  if (e.key === "ArrowRight" || e.key === "ArrowLeft") { const n = $("tab-scan").getAttribute("aria-selected") === "true" ? "cat" : "scan"; tab(n); $(n === "scan" ? "tab-scan" : "tab-cat").focus(); }
});

/* ---------- служебное ---------- */
let toastT;
function toast(msg) { const el = $("toast"); el.textContent = msg; el.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("show"), 2600); }
document.addEventListener("visibilitychange", () => { if (document.hidden && running) { stopCam(); setState("idle"); } });
window.addEventListener("pagehide", () => { stopCam(); clearPhoto(); });
window.addEventListener("scroll", () => $("top").classList.toggle("scrolled", scrollY > 4), { passive: true });

/* ---------- ссылки: #catalog, #obj=<id>, #lang=kk|ru|en ---------- */
function applyHash() {
  const h = decodeURIComponent(location.hash.slice(1));
  h.split("&").forEach(part => {
    if (part === "catalog") tab("cat");
    const lg = part.match(/^lang=(kk|ru|en)$/); if (lg && lg[1] !== lang) setLang(lg[1]);
    const m = part.match(/^obj=([\w-]+)$/); if (m && BY_ID[m[1]]) openCard(m[1]);
  });
}
window.addEventListener("hashchange", applyHash);

renderLang(); applyStatic(); renderProgress(); renderRecent(); renderChips(); renderList();
setState("loading");
applyHash();
loadModel();
</script>
</body>
</html>
