<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f1a15">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Тарих Сканер">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Тарих Сканер Ақтөбе</title>
<style>
:root{--bg:#f6f1e7;--card:#fffaf0;--ink:#2a2118;--muted:#7a6a58;--accent:#9c5b1b;--accent2:#1f5f5b;--line:#e2d6c2;--ok:#2e7d4f;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--nav:64px}
@media (prefers-color-scheme:dark){:root{--bg:#17130f;--card:#221c16;--ink:#f1e7d8;--muted:#a8978a;--accent:#e0a050;--accent2:#5fb3a8;--line:#3a3027;--ok:#5fc48a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:manipulation;overscroll-behavior-y:none}
button,label{font:inherit;touch-action:manipulation}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + var(--st)) 16px 8px;display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;line-height:1.2}
header .sub{font-size:12px;color:var(--muted)}
.logo{width:34px;height:34px;border-radius:10px;background:var(--accent);display:grid;place-items:center;color:#fff;font-weight:700;flex:none}
main{max-width:640px;margin:0 auto;padding:0 16px calc(var(--nav) + var(--sb) + 16px)}
/* --- сканер --- */
.cam{position:relative;border-radius:18px;overflow:hidden;background:#000;width:100%;
  height:calc(100dvh - var(--nav) - var(--sb) - var(--st) - 235px);min-height:300px;max-height:640px}
.cam video,.cam img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.frame{position:absolute;inset:14% 10%;border-radius:16px;pointer-events:none;
  background:linear-gradient(#fff,#fff) top left/26px 3px,linear-gradient(#fff,#fff) top left/3px 26px,
  linear-gradient(#fff,#fff) top right/26px 3px,linear-gradient(#fff,#fff) top right/3px 26px,
  linear-gradient(#fff,#fff) bottom left/26px 3px,linear-gradient(#fff,#fff) bottom left/3px 26px,
  linear-gradient(#fff,#fff) bottom right/26px 3px,linear-gradient(#fff,#fff) bottom right/3px 26px;background-repeat:no-repeat;opacity:.85}
.scanning .frame{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.idle{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#ddd;padding:24px;font-size:15px}
.idle b{display:block;font-size:44px;margin-bottom:6px}
.hint{position:absolute;left:0;right:0;bottom:0;padding:12px 14px;background:linear-gradient(transparent,rgba(0,0,0,.8));color:#fff;font-size:15px;font-weight:600}
.bar{height:6px;background:rgba(255,255,255,.25);border-radius:3px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#7ee0a0;transition:width .2s}
.ctrls{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}
.btn{min-height:52px;padding:12px 16px;border-radius:14px;border:0;background:var(--accent2);color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.btn:active{transform:scale(.98)}
.btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:600}
.btn.sq{width:52px;padding:0;font-size:22px}
.btn input{display:none}
.status{margin-top:8px;font-size:13px;color:var(--muted)}
.progress{margin-top:8px;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px;font-size:14px}
/* --- каталог --- */
.chips{display:flex;gap:6px;margin:4px -16px 10px;padding:0 16px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;padding:8px 14px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:14px;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sect{font-size:13px;color:var(--muted);margin:14px 2px 6px;text-transform:uppercase;letter-spacing:.4px}
.item{display:flex;gap:12px;align-items:center;min-height:64px;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;cursor:pointer}
.item:active{background:var(--line)}
.ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--bg);flex:none}
.item b{display:block;font-size:15px;line-height:1.25}
.item small{color:var(--muted);font-size:13px}
.seen{margin-left:auto;color:var(--ok);font-weight:700;font-size:18px}
/* --- нижняя навигация --- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:var(--sb)}
nav button{flex:1;height:var(--nav);border:0;background:none;color:var(--muted);font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav button span{font-size:22px;line-height:1}
nav button.on{color:var(--accent)}
/* --- карточка --- */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:9}
.modal.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:88dvh;overflow:auto;overscroll-behavior:contain;border-radius:22px 22px 0 0;padding:8px 18px calc(18px + var(--sb));animation:up .25s ease;touch-action:pan-y}
@keyframes up{from{transform:translateY(60px);opacity:0}}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.sheet h2{margin:8px 0 2px;font-size:22px;line-height:1.2}
.kk{color:var(--accent);font-weight:600}
.meta{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:14px;margin:12px 0;padding:10px 12px;background:var(--bg);border-radius:12px}
.meta span:nth-child(odd){color:var(--muted)}
.sheet p{font-size:16px;line-height:1.55}
.tag{display:inline-block;font-size:12px;padding:3px 9px;border-radius:8px;background:var(--accent2);color:#fff;margin-right:4px}
.conf{font-size:13px;color:var(--ok);margin-top:6px;font-weight:600}
.warn{font-size:12px;color:var(--muted);margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.hidden{display:none!important}
@media (min-width:700px){.cam{height:min(62vh,640px)}}
</style>
</head>
<body>
<header>
  <div class="logo">AI</div>
  <div><h1>Тарих Сканер · Ақтөбе</h1><div class="sub">Наведи камеру — узнай историю</div></div>
</header>

<main>
  <section id="scan">
    <div class="cam" id="cam">
      <video id="video" playsinline muted autoplay></video>
      <img id="photo" class="hidden" alt="">
      <div class="idle" id="idle"><div><b>📷</b>Нажмите «Сканировать» и наведите камеру на памятник или табличку улицы</div></div>
      <div class="frame"></div>
      <div class="hint"><div id="hint">Загрузка модели…</div><div class="bar"><i id="barFill"></i></div></div>
    </div>
    <div class="ctrls">
      <button class="btn" id="camBtn">▶ Сканировать</button>
      <label class="btn alt sq" title="Фото из галереи">🖼<input type="file" id="photoIn" accept="image/*"></label>
    </div>
    <div class="ctrls hidden" id="modelRow" style="grid-template-columns:1fr">
      <label class="btn alt">🧠 Загрузить модель (3 файла)<input type="file" id="modelIn" multiple accept=".json,.bin"></label>
    </div>
    <div class="status" id="status">Модель: ищу в папке model/…</div>
    <div class="progress" id="prog"></div>
  </section>

  <section id="cat" class="hidden">
    <div class="chips" id="chips"></div>
    <div id="list"></div>
  </section>
</main>

<nav>
  <button id="tScan" class="on"><span>📷</span>Сканер</button>
  <button id="tCat"><span>📜</span>Каталог</button>
</nav>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.5/dist/teachablemachine-image.min.js"></script>
<script src="data.js"></script>
<script>
const $ = id => document.getElementById(id);
const BY_ID = Object.fromEntries(ALL_OBJECTS.map(o => [o.id, o]));   // распознаём ВСЕ объекты
const ICON = { monument: "🗿", building: "🏛", street: "🪧", place: "📍" };
const THRESH = 0.85, STABLE = 4;
let model = null, stream = null, running = false, busy = false, lastId = null, streak = 0, modalOpen = false;

// ---- просмотренные (локально, необязательно) ----
let seen = new Set();
try { seen = new Set(JSON.parse(localStorage.getItem("seen") || "[]")); } catch (e) {}
function markSeen(id){ seen.add(id); try{ localStorage.setItem("seen", JSON.stringify([...seen])); }catch(e){} renderProgress(); renderList(); }
function renderProgress(){
  const s = OBJECTS.filter(o => seen.has(o.id)).length;
  $("prog").innerHTML = `🏅 Изучено: <b>${s} из ${OBJECTS.length}</b> · ` + Object.entries(ZONES).map(([k,v]) => `${v}: ${OBJECTS.filter(o=>o.zone===k).length}`).join(", ");
}

// ---- вкладки ----
function tab(scan){
  $("scan").classList.toggle("hidden", !scan); $("cat").classList.toggle("hidden", scan);
  $("tScan").classList.toggle("on", scan); $("tCat").classList.toggle("on", !scan);
  if (!scan && running) stopCam();
  window.scrollTo(0, 0);
}
$("tScan").onclick = () => tab(true);
$("tCat").onclick = () => tab(false);

// ---- каталог: сначала проспекты проекта, ниже «Другие» ----
let zone = "all";
function renderChips(){
  const z = { all: "Проект", ...ZONES, other: "Другие" };
  $("chips").innerHTML = Object.entries(z).map(([k,v]) => `<button class="chip ${k===zone?"on":""}" data-z="${k}">${v}</button>`).join("");
  $("chips").querySelectorAll("button").forEach(b => b.onclick = () => { zone = b.dataset.z; renderChips(); renderList(); });
}
const itemHTML = o => `<div class="item" data-id="${o.id}"><div class="ico">${ICON[o.type]}</div><div><b>${o.name}</b><small>${TYPES[o.type]} · ${ZONE_NAMES[o.zone]}</small></div>${seen.has(o.id)?'<span class="seen">✓</span>':""}</div>`;
function renderList(){
  let html = "";
  if (zone === "other") html = OTHER_OBJECTS.map(itemHTML).join("");
  else {
    const zs = zone === "all" ? Object.keys(ZONES) : [zone];
    html = zs.map(z => `<div class="sect">${ZONES[z]}</div>` + OBJECTS.filter(o => o.zone === z).map(itemHTML).join("")).join("");
  }
  $("list").innerHTML = html;
  $("list").querySelectorAll(".item").forEach(el => el.onclick = () => openCard(el.dataset.id));
}

// ---- карточка ----
function openCard(id, prob){
  const o = BY_ID[id]; if(!o) return;
  modalOpen = true;
  if (prob && navigator.vibrate) navigator.vibrate(60);
  $("sheet").innerHTML = `
    <div class="grab"></div>
    <span class="tag">${TYPES[o.type]}</span><span class="tag" style="background:var(--accent)">${ZONE_NAMES[o.zone]}</span>
    <h2>${o.name}</h2><div class="kk">${o.nameKk}</div>
    ${prob ? `<div class="conf">ИИ распознал с уверенностью ${(prob*100).toFixed(0)}%</div>` : ""}
    <div class="meta">
      <span>📍 Где</span><span>${o.place}</span>
      <span>📅 Год</span><span>${o.year}</span>
      ${o.oldNames ? `<span>🕰 Названия</span><span>${o.oldNames}</span>` : ""}
    </div>
    <p>${o.text}</p>
    <button class="btn" id="closeBtn" style="width:100%">${running ? "Сканировать дальше" : "Закрыть"}</button>
    <div class="warn">Данные собраны из открытых источников и требуют проверки по краеведческому музею.</div>`;
  $("modal").classList.add("show");
  $("sheet").scrollTop = 0;
  $("closeBtn").onclick = closeCard;
  markSeen(id);
}
function closeCard(){ $("modal").classList.remove("show"); modalOpen = false; streak = 0; lastId = null; }
$("modal").onclick = e => { if (e.target.id === "modal") closeCard(); };
// свайп вниз закрывает карточку
let ty = null;
$("sheet").addEventListener("touchstart", e => { ty = $("sheet").scrollTop <= 0 ? e.touches[0].clientY : null; }, {passive:true});
$("sheet").addEventListener("touchend", e => { if (ty !== null && e.changedTouches[0].clientY - ty > 90) closeCard(); ty = null; }, {passive:true});

// ---- модель ----
function modelReady(m, src){
  model = m;
  const labels = m.getClassLabels ? m.getClassLabels() : [];
  const unknown = labels.filter(l => !BY_ID[l] && l !== "fon");
  $("status").textContent = `Модель загружена (${src}): классов ${labels.length}.` + (unknown.length ? ` ⚠ Нет в базе: ${unknown.join(", ")}` : "");
  $("modelRow").classList.add("hidden");
  $("hint").textContent = "Готово. Нажмите «Сканировать»";
}
async function autoLoad(){
  try { modelReady(await tmImage.load("model/model.json", "model/metadata.json"), "папка model/"); }
  catch (e) {
    $("modelRow").classList.remove("hidden");
    $("hint").textContent = "Модель не найдена";
    $("status").textContent = "Модель не найдена в папке model/. Загрузите 3 файла из Teachable Machine. Каталог работает и без модели.";
  }
}
$("modelIn").onchange = async e => {
  const f = [...e.target.files], get = n => f.find(x => x.name.toLowerCase().includes(n));
  const mj = get("model.json"), wb = get(".bin"), md = get("metadata");
  if (!mj || !wb || !md) { $("status").textContent = "Нужны все 3 файла: model.json, weights.bin, metadata.json"; return; }
  try { modelReady(await tmImage.loadFromFiles(mj, wb, md), "из файлов"); }
  catch (err) { $("status").textContent = "Ошибка загрузки модели: " + err.message; }
};

// ---- распознавание ----
async function classify(el){
  const preds = await model.predict(el);
  preds.sort((a,b) => b.probability - a.probability);
  return preds[0];
}
function showTop(top){
  const o = BY_ID[top.className];
  $("barFill").style.width = (top.probability*100) + "%";
  $("hint").textContent = o ? `${o.name} — ${(top.probability*100).toFixed(0)}%` : "Ищу объект…";
}
async function loop(){
  if (!running) return;
  if (model && !modalOpen && !busy && $("video").readyState >= 2) {
    busy = true;
    try {
      const top = await classify($("video"));
      showTop(top);
      if (BY_ID[top.className] && top.probability >= THRESH) {
        streak = top.className === lastId ? streak + 1 : 1; lastId = top.className;
        if (streak >= STABLE) openCard(top.className, top.probability);
      } else { streak = 0; lastId = null; }
    } finally { busy = false; }
  }
  setTimeout(() => requestAnimationFrame(loop), 180);
}
function stopCam(){
  running = false; stream && stream.getTracks().forEach(t => t.stop()); stream = null;
  $("camBtn").textContent = "▶ Сканировать"; $("cam").classList.remove("scanning");
  $("idle").classList.remove("hidden");
}
$("camBtn").onclick = async () => {
  if (running) { stopCam(); return; }
  if (!model) { $("status").textContent = "Сначала нужна модель. Пока можно смотреть Каталог."; return; }
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
    $("photo").classList.add("hidden"); $("idle").classList.add("hidden"); $("video").classList.remove("hidden");
    $("video").srcObject = stream; await $("video").play();
    running = true; $("camBtn").textContent = "⏸ Стоп"; $("cam").classList.add("scanning"); loop();
  } catch (e) {
    $("status").textContent = "Камера недоступна: " + e.message + ". Откройте сайт в Chrome/Safari по https-ссылке (не из мессенджера).";
  }
};
// экономим батарею: свернули приложение — камера выключается
document.addEventListener("visibilitychange", () => { if (document.hidden && running) stopCam(); });

$("photoIn").onchange = e => {
  const file = e.target.files[0]; if (!file) return;
  if (!model) { $("status").textContent = "Сначала загрузите модель."; return; }
  if (running) stopCam();
  const img = $("photo");
  img.onload = async () => {
    const top = await classify(img); showTop(top);
    if (BY_ID[top.className] && top.probability >= 0.6) openCard(top.className, top.probability);
    else $("hint").textContent = "Объект не распознан. Попробуйте другой ракурс.";
  };
  img.src = URL.createObjectURL(file);
  img.classList.remove("hidden"); $("idle").classList.add("hidden"); $("video").classList.add("hidden");
  e.target.value = "";
};

renderProgress(); renderChips(); renderList();
if (window.tmImage) autoLoad(); else { $("hint").textContent = "Нет интернета"; $("status").textContent = "Библиотеки ИИ не загрузились. Каталог работает."; }
</script>
</body>
</html>
