<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тарих Сканер Ақтөбе</title>
<style>
:root{--bg:#f6f1e7;--card:#fffaf0;--ink:#2a2118;--muted:#7a6a58;--accent:#9c5b1b;--accent2:#1f5f5b;--line:#e2d6c2;--ok:#2e7d4f}
@media (prefers-color-scheme:dark){:root{--bg:#17130f;--card:#221c16;--ink:#f1e7d8;--muted:#a8978a;--accent:#e0a050;--accent2:#5fb3a8;--line:#3a3027;--ok:#5fc48a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:14px 16px 8px;display:flex;align-items:center;gap:10px}
header h1{font-size:20px;margin:0;letter-spacing:.3px}
header .sub{font-size:12px;color:var(--muted)}
.logo{width:36px;height:36px;border-radius:10px;background:var(--accent);display:grid;place-items:center;color:#fff;font-weight:700}
nav{display:flex;gap:6px;padding:0 16px 10px}
nav button{flex:1;padding:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font-weight:600}
nav button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
main{padding:0 16px 90px;max-width:640px;margin:0 auto}
.cam{position:relative;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:3/4;max-height:62vh;width:100%}
.cam video,.cam img{width:100%;height:100%;object-fit:cover;display:block}
.frame{position:absolute;inset:12%;border:2px dashed rgba(255,255,255,.7);border-radius:14px;pointer-events:none}
.hint{position:absolute;left:0;right:0;bottom:0;padding:10px 12px;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;font-size:14px}
.bar{height:6px;background:rgba(255,255,255,.25);border-radius:3px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#7ee0a0;transition:width .2s}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{flex:1;min-width:140px;padding:12px;border-radius:12px;border:0;background:var(--accent2);color:#fff;font-weight:600;font-size:15px;text-align:center;cursor:pointer}
.btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn input{display:none}
.status{margin-top:10px;font-size:13px;color:var(--muted)}
.progress{margin-top:12px;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px;font-size:14px}
.chips{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:14px}
.chip.on{background:var(--ink);color:var(--bg)}
.item{display:flex;gap:10px;align-items:center;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer}
.ico{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:18px;background:var(--bg);flex:none}
.item b{display:block;font-size:15px}
.item small{color:var(--muted)}
.seen{margin-left:auto;color:var(--ok);font-weight:700}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:9}
.modal.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px 28px;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h2{margin:4px 0 2px;font-size:22px}
.kk{color:var(--accent);font-weight:600}
.meta{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:14px;margin:12px 0;padding:10px;background:var(--bg);border-radius:10px}
.meta span:nth-child(odd){color:var(--muted)}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:8px;background:var(--accent2);color:#fff;margin-right:4px}
.conf{font-size:13px;color:var(--ok);margin-top:6px}
.warn{font-size:12px;color:var(--muted);margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.hidden{display:none}
</style>
</head>
<body>
<header>
  <div class="logo">AI</div>
  <div><h1>Тарих Сканер · Ақтөбе</h1><div class="sub">Наведи камеру — узнай историю</div></div>
</header>
<nav>
  <button id="tScan" class="on">📷 Сканер</button>
  <button id="tCat">📜 Каталог</button>
</nav>
<main>
  <section id="scan">
    <div class="cam">
      <video id="video" playsinline muted></video>
      <img id="photo" class="hidden" alt="">
      <div class="frame"></div>
      <div class="hint"><div id="hint">Загрузите модель и включите камеру</div><div class="bar"><i id="barFill"></i></div></div>
    </div>
    <div class="row">
      <button class="btn" id="camBtn">▶ Включить камеру</button>
      <label class="btn alt">🖼 Фото из галереи<input type="file" id="photoIn" accept="image/*"></label>
    </div>
    <div class="row" id="modelRow">
      <label class="btn alt">🧠 Загрузить модель (3 файла)<input type="file" id="modelIn" multiple accept=".json,.bin"></label>
    </div>
    <div class="status" id="status">Модель: ищу в папке model/…</div>
    <div class="progress" id="prog"></div>
  </section>

  <section id="cat" class="hidden">
    <div class="chips" id="chips"></div>
    <div id="list"></div>
  </section>
</main>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.5/dist/teachablemachine-image.min.js"></script>
<script src="data.js"></script>
<script>
const $ = id => document.getElementById(id);
const BY_ID = Object.fromEntries(OBJECTS.map(o => [o.id, o]));
const ICON = { monument: "🗿", building: "🏛", street: "🪧", place: "📍" };
const THRESH = 0.85, STABLE = 4;
let model = null, stream = null, running = false, lastId = null, streak = 0, modalOpen = false;

// ---- просмотренные объекты (локально, необязательно) ----
let seen = new Set();
try { seen = new Set(JSON.parse(localStorage.getItem("seen") || "[]")); } catch (e) {}
function markSeen(id){ seen.add(id); try{ localStorage.setItem("seen", JSON.stringify([...seen])); }catch(e){} renderProgress(); renderList(); }
function renderProgress(){
  const s = OBJECTS.filter(o => seen.has(o.id)).length;
  $("prog").innerHTML = `🏅 Изучено объектов: <b>${s} из ${OBJECTS.length}</b> · ` + Object.entries(ZONES).map(([k,v]) => `${v}: ${OBJECTS.filter(o=>o.zone===k).length}`).join(", ");
}

// ---- вкладки ----
function tab(scan){
  $("scan").classList.toggle("hidden", !scan); $("cat").classList.toggle("hidden", scan);
  $("tScan").classList.toggle("on", scan); $("tCat").classList.toggle("on", !scan);
}
$("tScan").onclick = () => tab(true);
$("tCat").onclick = () => tab(false);

// ---- каталог ----
let zone = "all";
function renderChips(){
  const z = { all: "Все", ...ZONES };
  $("chips").innerHTML = Object.entries(z).map(([k,v]) => `<button class="chip ${k===zone?"on":""}" data-z="${k}">${v}</button>`).join("");
  $("chips").querySelectorAll("button").forEach(b => b.onclick = () => { zone = b.dataset.z; renderChips(); renderList(); });
}
function renderList(){
  $("list").innerHTML = OBJECTS.filter(o => zone==="all" || o.zone===zone).map(o =>
    `<div class="item" data-id="${o.id}"><div class="ico">${ICON[o.type]}</div><div><b>${o.name}</b><small>${TYPES[o.type]} · ${ZONES[o.zone]}</small></div>${seen.has(o.id)?'<span class="seen">✓</span>':""}</div>`).join("");
  $("list").querySelectorAll(".item").forEach(el => el.onclick = () => openCard(el.dataset.id));
}

// ---- карточка ----
function openCard(id, prob){
  const o = BY_ID[id]; if(!o) return;
  modalOpen = true;
  $("sheet").innerHTML = `
    <span class="tag">${TYPES[o.type]}</span><span class="tag" style="background:var(--accent)">${ZONES[o.zone]}</span>
    <h2>${o.name}</h2><div class="kk">${o.nameKk}</div>
    ${prob ? `<div class="conf">ИИ распознал с уверенностью ${(prob*100).toFixed(0)}%</div>` : ""}
    <div class="meta">
      <span>📍 Где</span><span>${o.place}</span>
      <span>📅 Год</span><span>${o.year}</span>
      ${o.oldNames ? `<span>🕰 Названия</span><span>${o.oldNames}</span>` : ""}
    </div>
    <p>${o.text}</p>
    <button class="btn" id="closeBtn" style="width:100%">Сканировать дальше</button>
    <div class="warn">Данные собраны из открытых источников и требуют проверки по краеведческому музею.</div>`;
  $("modal").classList.add("show");
  $("closeBtn").onclick = closeCard;
  markSeen(id);
}
function closeCard(){ $("modal").classList.remove("show"); modalOpen = false; streak = 0; lastId = null; }
$("modal").onclick = e => { if (e.target.id === "modal") closeCard(); };

// ---- модель ----
function modelReady(m, src){
  model = m;
  const labels = m.getClassLabels ? m.getClassLabels() : [];
  const unknown = labels.filter(l => !BY_ID[l] && l !== "fon");
  $("status").textContent = `Модель загружена (${src}): классов ${labels.length}.` + (unknown.length ? ` ⚠ Нет в базе: ${unknown.join(", ")}` : "");
  $("modelRow").classList.add("hidden");
  $("hint").textContent = "Включите камеру или выберите фото";
}
async function autoLoad(){
  try {
    const m = await tmImage.load("model/model.json", "model/metadata.json");
    modelReady(m, "папка model/");
  } catch (e) {
    $("status").textContent = "Модель не найдена в папке model/. Загрузите 3 файла из Teachable Machine (model.json, weights.bin, metadata.json). Каталог работает и без модели.";
  }
}
$("modelIn").onchange = async e => {
  const f = [...e.target.files], get = n => f.find(x => x.name.toLowerCase().includes(n));
  const mj = get("model.json"), wb = get(".bin"), md = get("metadata");
  if (!mj || !wb || !md) { $("status").textContent = "Нужны все 3 файла: model.json, weights.bin, metadata.json"; return; }
  try { modelReady(await tmImage.loadFromFiles(mj, wb, md), "из файлов"); }
  catch (err) { $("status").textContent = "Ошибка загрузки модели: " + err.message; }
};

// ---- распознавание ----
async function classify(el){
  const preds = await model.predict(el);
  preds.sort((a,b) => b.probability - a.probability);
  return preds[0];
}
function showTop(top){
  const o = BY_ID[top.className];
  $("barFill").style.width = (top.probability*100) + "%";
  $("hint").textContent = o && top.className !== "fon" ? `${o.name} — ${(top.probability*100).toFixed(0)}%` : "Ищу объект…";
}
async function loop(){
  if (!running) return;
  if (model && !modalOpen && $("video").readyState >= 2) {
    const top = await classify($("video"));
    showTop(top);
    if (BY_ID[top.className] && top.probability >= THRESH) {
      streak = top.className === lastId ? streak + 1 : 1; lastId = top.className;
      if (streak >= STABLE) openCard(top.className, top.probability);
    } else { streak = 0; lastId = null; }
  }
  setTimeout(() => requestAnimationFrame(loop), 150);
}
$("camBtn").onclick = async () => {
  if (running) { running = false; stream && stream.getTracks().forEach(t => t.stop()); $("camBtn").textContent = "▶ Включить камеру"; return; }
  if (!model) { $("status").textContent = "Сначала нужна модель. Пока можно смотреть Каталог."; return; }
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
    $("photo").classList.add("hidden"); $("video").classList.remove("hidden");
    $("video").srcObject = stream; await $("video").play();
    running = true; $("camBtn").textContent = "⏸ Остановить"; loop();
  } catch (e) {
    $("status").textContent = "Камера недоступна: " + e.message + ". Камера работает только через https:// или localhost.";
  }
};
$("photoIn").onchange = e => {
  const file = e.target.files[0]; if (!file) return;
  if (!model) { $("status").textContent = "Сначала загрузите модель."; return; }
  const img = $("photo");
  img.onload = async () => {
    const top = await classify(img); showTop(top);
    if (BY_ID[top.className] && top.probability >= 0.6) openCard(top.className, top.probability);
    else $("hint").textContent = "Объект не распознан. Попробуйте другой ракурс.";
  };
  img.src = URL.createObjectURL(file);
  img.classList.remove("hidden"); $("video").classList.add("hidden");
};

renderProgress(); renderChips(); renderList();
if (window.tmImage) autoLoad(); else $("status").textContent = "Нет интернета: библиотеки ИИ не загрузились. Каталог работает.";
</script>
</body>
</html>
